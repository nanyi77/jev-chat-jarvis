name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - deepseek-official-api

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SM="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          else
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv /tmp/cmdtools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
            SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          set +e
          yes | "$SM" --licenses >/dev/null
          set -e
          "$SM" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: bash ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk jev-assistant-deepseek-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jev-assistant-deepseek-debug
          path: jev-assistant-deepseek-debug.apk
          if-no-files-found: error
          retention-days: 14
