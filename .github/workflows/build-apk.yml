name: Build debug APK

on:
  push:
    branches:
      - deepseek-official-api
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install compile SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: bash ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk jev-assistant-deepseek-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jev-assistant-deepseek-debug
          path: jev-assistant-deepseek-debug.apk
          if-no-files-found: error
          retention-days: 14
